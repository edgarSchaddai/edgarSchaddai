name: Actualizar estadísticas

on:
  schedule:
    - cron: "17 6 * * *" # diario, 06:17 UTC (~00:17 hora centro de México)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Generar SVGs
        run: node scripts/generate-stats.mjs
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-light.svg assets/stats-dark.svg
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualiza estadísticas automáticamente"
            git push
          fi
