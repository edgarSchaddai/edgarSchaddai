<svg xmlns="http://www.w3.org/2000/svg" width="840" height="248" viewBox="0 0 840 248" role="img" aria-label="Estadísticas de GitHub: 178 contribuciones en el último año, 172 commits, 7 repositorios. Lenguajes ponderados por repositorio.">
  <title>Estadísticas de GitHub de Edgar Schaddaí</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .label { font-size: 12px; fill: #898781; }
    .value { font-size: 26px; font-weight: 600; fill: #ffffff; }
    .lang  { font-size: 11px; fill: #c3c2b7; }
